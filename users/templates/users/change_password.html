{% extends 'chipin/base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="dashboard-container content-fade">
    <h2 class="welcome-text">Change Your Password</h2>

    <form method="post" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn primary-btn mt-4">Change Password</button>
    </form>
</div>
{% endblock %}
