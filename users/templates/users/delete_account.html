{% extends 'chipin/base.html' %}
{% load static %}
{% block title %}Delete Account - SafeSwap{% endblock %}

{% block content %}
<div class="delete-account-container content-fade">
    <h1 class="form-title">Delete Account</h1>
    <p class="delete-warning">⚠️ This action is permanent and cannot be undone. All your data will be lost.</p>

    <form method="POST" class="delete-account-form">
        {% csrf_token %}
        <button type="submit" class="btn danger-btn">Delete My Account</button>
    </form>
</div>
{% endblock %}
