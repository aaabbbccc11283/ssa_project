{% extends 'chipin/base.html' %}
{% load static %}
{% load socialaccount %}

{% block title %}Login - SafeSwap{% endblock %}

{% block content %}
<div class="login-container content-fade">
    <h1 class="form-title">Login</h1>

    <form action="{% url 'users:login' %}" method="post" class="login-form">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn primary-btn">Log In</button>
    </form>

    <div class="divider">or</div>

    <a href="{% provider_login_url 'github' %}" class="btn secondary-btn">Sign in with GitHub</a>
</div>
{% endblock %}
