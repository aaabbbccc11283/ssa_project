{% extends 'chipin/base.html' %}

{% block title %}Create a New Transfer Portal{% endblock %}

{% block content %}
<div class="create-group-container content-fade">
    <h1 class="form-title">Create a New Transfer Portal</h1>
    <p class="form-note">Include the all parties Involed</p>


    <form method="post" class="create-group-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn primary-btn">Create Transfer Portal</button>
    </form>

    <div class="back-link">
        <a href="{% url 'chipin:home' %}" class="btn secondary-btn">← Back to Homepage</a>
    </div>
</div>
{% endblock %}
