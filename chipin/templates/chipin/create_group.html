{% extends 'chipin/base.html' %}

{% block title %}Create a New Transfer Portal{% endblock %}

{% block content %}

        {% csrf_token %}

    </form>
    <a href="{% url 'chipin:home' %}">Back to Homepage</a>
{% endblock %}
