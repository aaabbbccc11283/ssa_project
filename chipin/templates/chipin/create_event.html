{% extends 'chipin/base.html' %}
{% block title %}Create Transaction{% endblock %}

{% block content %}
<div class="create-event-container content-fade">
    <h2 class="form-title">Create Transaction for {{ group.name }}</h2>

    <form method="POST" class="create-event-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Transaction Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label for="date">Due Date</label>
            <input type="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="total_spend">Total Amount Due</label>
            <input type="number" name="total_spend" step="1.00" required>
        </div>

        <button type="submit" class="btn primary-btn">Create Transaction</button>
    </form>

    <div class="back-link">
        <a href="{% url 'chipin:group_detail' group.id %}" class="btn secondary-btn">← Back to Group</a>
    </div>
</div>
{% endblock %}
